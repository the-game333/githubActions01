name: QA Tests

on:
  push:
    branches:
      - qa
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  qa-tests:
    name: QA tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run QA tests
        run: npm run test:qa
